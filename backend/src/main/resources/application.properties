spring.application.name=repair_desk_backend

# ===== Server =====
server.port=8089

# ===== PostgreSQL Datasource =====
spring.datasource.url=jdbc:postgresql://localhost:5432/repair_desk
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== JWT  base 64 =====
app.jwt.secret=vgxdEz4Vqlz12KWE6TNPdD6swKI/c1lPywAZp7Jt7ZQ=
app.jwt.expiration-ms=86400000

# ===== Jackson (clean date format in JSON) =====
spring.jackson.date-format=dd-MM-yyyy HH:mm:ss
spring.jackson.time-zone=Africa/Tunis